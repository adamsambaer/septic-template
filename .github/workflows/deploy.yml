name: Deploy Landing Page

on:
  workflow_dispatch:
    inputs:
      webhook_url:
        description: 'Webhook URL for status updates'
        required: false
        type: string
        default: ''
      webhook_secret:
        description: 'Webhook secret for signing'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Webhook - Deploy Started
        if: inputs.webhook_url != '' && inputs.webhook_secret != ''
        run: |
          .github/scripts/send-webhook.sh \
            --url "${{ inputs.webhook_url }}" \
            --secret "${{ inputs.webhook_secret }}" \
            --stage "deploying" \
            --status "started"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure npm auth
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_FOR_PACKAGES }}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Required
          NEXT_PUBLIC_SAPT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SAPT_PROJECT_ID }}
          # Optional
          NEXT_PUBLIC_SAPT_PROJECT_SLUG: ${{ vars.NEXT_PUBLIC_SAPT_PROJECT_SLUG }}
          NEXT_PUBLIC_SAPT_BASE_URL: ${{ vars.NEXT_PUBLIC_SAPT_BASE_URL || 'https://api.sapt.ai' }}
          NEXT_PUBLIC_SAPT_INGEST_URL: ${{ vars.NEXT_PUBLIC_SAPT_INGEST_URL || 'https://ingest.sapt.ai' }}
          # Optional server-only secret (enables CMS-driven copy)
          SAPT_API_KEY: ${{ secrets.SAPT_API_KEY }}

      - name: Deploy to Cloudflare
        run: pnpm deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Send Webhook - Deploy Success
        if: success() && inputs.webhook_url != '' && inputs.webhook_secret != ''
        run: |
          .github/scripts/send-webhook.sh \
            --url "${{ inputs.webhook_url }}" \
            --secret "${{ inputs.webhook_secret }}" \
            --stage "completed" \
            --status "success" \
            --staging-domain "${{ vars.LANDING_DOMAIN }}"

      - name: Send Webhook - Deploy Failed
        if: failure() && inputs.webhook_url != '' && inputs.webhook_secret != ''
        run: |
          .github/scripts/send-webhook.sh \
            --url "${{ inputs.webhook_url }}" \
            --secret "${{ inputs.webhook_secret }}" \
            --stage "deploying" \
            --status "error"
